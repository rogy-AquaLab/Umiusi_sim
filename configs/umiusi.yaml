# Physical parameters for the UMIUSI MuJoCo model.  Units: SI (m, kg, s, rad).
# Coordinate frame: CAD frame with +Y UP (the 4 thrusters lie in the X-Z plane).
# Values marked PLACEHOLDER are first estimates to be calibrated in phase-2 validation.

sim:
  timestep: 0.002              # 500 Hz physics
  control_rate_hz: 50          # policy / command rate (matches sinsei_umiusi controllers.yaml)
  gravity: [0.0, -9.81, 0.0]   # +Y is up in the CAD frame

water:
  density: 1000.0              # kg/m^3
  # Displaced (external hull) volume, NOT the CAD solid volume (3.726e6 mm^3 = material only).
  # ~ slightly positive of neutral: total mass 12.48 kg -> neutral 0.01248 m^3. Tune in validation.
  displaced_volume: 0.012600   # m^3
  # Center of buoyancy is auto-placed horizontally over the whole-vehicle CoM (base + 4
  # thrusters) and this far ABOVE it [m], giving a passive righting moment. Aligning with
  # the system CoM (not the base CoM) avoids a spurious steady couple.
  # 2026-08-21: fitted to the servo-debug pool bag (open-loop gyro replay, tools note in
  # docs/calibration_plan.md): the old 0.05 predicted large righting oscillations the real
  # vehicle does not show (it held ~30 deg tilts almost silently); 0.005-0.01 m fits best.
  # 0.01 chosen (conservative side); the static-tilt experiment (calibration plan 4) pins it.
  # CAVEAT: the bag has an unmodeled tether, which may mimic extra righting/damping.
  buoyancy_offset_above_com: 0.010

# --- hull (base_link), measured in CAD -----------------------------------------
hull:
  mass: 9.963939               # kg  (9963.939 g)
  com: [-0.241053, 0.093368, 0.000327]        # m
  # fullinertia about CoM [kg m^2], MJCF order: Ixx Iyy Izz Ixy Ixz Iyz
  fullinertia: [0.1865, 0.4736, 0.3380, 1.499e-4, 4.590e-4, -8.78e-7]
  half_extents: [0.35098, 0.110, 0.26499]     # m  (bbox 701.96 x 220.00 x 529.99 mm)
  center: [-0.23098, 0.100, 0.0]              # bbox center in hull frame [m]

# --- hydrodynamic damping, diagonal, body axes ------------------------------------------------
# ORDER: [x(surge), y(heave/up), z(sway), rot+X(roll), rot+Y(yaw), rot+Z(pitch)] — +Y is UP here,
# so rotation about +Y is YAW, not pitch.
# Derived from CAD silhouette areas x BlueROV2-identified effective Cd (von Benzon et al. 2022,
# JMSE 10(12):1898, same vehicle class). Re-derive: python -m tools.estimate_hydro
# ESTIMATES, not measurements — docs/calibration_plan.md has the in-water experiments.
drag:
  linear:    [11.5, 13.7, 0.0, 0.15, 0.60, 1.19]    # N/(m/s) ; N*m/(rad/s)
  quadratic: [118.0, 79.1, 144.0, 0.49, 2.01, 0.70] # N/(m/s)^2 ; N*m/(rad/s)^2
added_mass:
  # Diagonal added mass/inertia, same axis order as drag. Estimated (tools/estimate_hydro.py) from
  # Lamb's ellipsoid x per-axis solidity, calibrated against BlueROV2 published values; residual
  # ~±30 % translational, ~x2 rotational, which domain-rand covers. Do NOT zero these: heave added
  # mass is 57 % of vehicle mass and dropping it badly overpredicts the vertical/pitch transient.
  diag: [2.69, 7.10, 3.16, 0.082, 0.165, 0.122]

# --- LIFT: force perpendicular to the body-frame flow, growing with angle of attack -----------
# force = coef * |v|^2 * sin(a)cos(a) perpendicular to v, a = angle of attack vs the longitudinal
# ref_axis. Vanishes for flow along the ref axis AND perpendicular to it, so only OBLIQUE flow
# lifts — that is what keeps the axis-aligned validate_sim invariants intact.
# coef = 1/2*rho*Cl*A [N/(m/s)^2], lumped. PLACEHOLDER — calibrate against tow tests. 0.0 = off.
lift:
  coef: 12.0                    # ~1.5 N max lift at the 0.4 m/s cruise speed (modest)
  ref_axis: [1.0, 0.0, 0.0]     # longitudinal (streamlined/elongated) body axis = +X (forward)

# --- Center-of-pressure OFFSET (translation-induced / Munk-like moment) -----------------------
# Translational drag is applied at CoM + this offset (body frame [x, y, z], m), so a broadside
# translation induces a turning/righting moment. PLACEHOLDER. [0, 0, 0] = drag through the CoM.
cop_offset: [0.03, 0.0, 0.0]

# --- Optional off-diagonal (cross-axis) damping moments ---------------------------------------
# Extra body moment coupled to translational velocity: M += -(lin*v + quad*|v|*v). Default 0 = OFF.
#   sway_yaw    body-Z (sway)  velocity -> yaw moment about +Y (weathercocking)
#   heave_pitch body-Y (heave) velocity -> pitch moment about +Z
# OFF by default: the CoP offset above already supplies a translation->moment coupling.
coupling:
  sway_yaw:    [0.0, 0.0]       # [linear N*m/(m/s), quadratic N*m/(m/s)^2]
  heave_pitch: [0.0, 0.0]

# --- thrusters (azimuth: servo angle + ESC thrust), measured pivots -------------
thrusters:
  mass: 0.629177               # kg per thruster (629.177 g)
  # Azimuth thruster (T-shaped ducted prop). The servo rotates the whole unit about the mounting
  # ARM (joint->prop, ~0.15 m, 45deg outboard); the thrust (prop axis) is PERPENDICULAR to the arm.
  # So the servo tilts thrust between HORIZONTAL tangential (servo=0) and VERTICAL (servo=+90, up),
  # i.e. phi = atan(f_vertical / f_horizontal) — matching sinsei_umiusi_control's FeedForward
  # allocation (horizontal comp -> surge/sway/yaw, vertical comp -> heave/roll/pitch).
  servo_range_deg: [-90.0, 90.0]
  # Servo = Hitec HS-646WP: datasheet ~300..350 deg/s no-load, derated for in-water load. Stall
  # torque is modeled as the actuator forcerange in description/umiusi.xml, not here.
  servo_slew_deg_per_s: 250.0  # servo rate limit
  # Tracking model: rate = clip((target - angle) / servo_tau_s, +/- slew). Beyond slew*tau (~12.5
  # deg) of error it moves at the slew limit, inside it as a first-order lag — so the servo
  # CONVERGES rather than rate-limiting forever. Keep tau > 0: a pure-slew servo never settles
  # under a flapping policy, which hides unreachable commands from training. 0 = pure slew.
  servo_tau_s: 0.05            # first-order small-signal time constant [s]
  thrust_slew_per_s: 4.0       # ESC command slew [esc units/s] (mirrors max_duty_step_per_sec); caps thrust changes
  # Thrust curve: F = sign(u) * |u|^thrust_curve_exp * thrust_per_cmd  (u = slewed esc command).
  # 2.0 = propeller law (duty -> rpm roughly linear, thrust ~ rpm^2); 1.0 = linear.
  # BOTH VALUES ARE UNCALIBRATED and confounded with each other: the only in-water data covers
  # |u| <= 0.2. Bench-calibrate (docs/calibration_plan.md, plan 3) before trusting absolute speed,
  # and RE-EXPORT any deployed policy afterwards — tools/export_policy.py copies these into the
  # bundle's action_contract, and the robot reproduces the plant from that copy.
  thrust_per_cmd: 30.0         # N at FULL command (|u| = 1)
  thrust_curve_exp: 2.0        # propeller-law exponent
  # ESC duty cap |u| <= max_duty, applied in the PLANT before the slew — the deploy-path clamp
  # (navigator/rl_attitude max_duty) made part of the training plant. Train WITH a cap: a
  # capless-trained policy saturates against the robot's clamp and degenerates to bang-bang.
  # 0.25 matches the deploy default and sits ~1.1x under the roll-capsize threshold.
  # domain_rand.max_duty_range randomizes it so one policy survives an operator raising the cap.
  max_duty: 0.25
  # Per-unit: pivot = measured servo joint (base_link frame; from CAD placement.txt), and
  # thrust_axis = the NEUTRAL (servo=0) thrust direction = horizontal tangential (perp to the arm),
  # expressed in the thruster body frame (= base frame at servo=0). The MJCF hinge axis (= arm) is
  # authoritative for how the servo rotates this.
  #
  # NAMES ARE GEOMETRIC, and they are what umiusi_rl.envs.mode_mixer keys its sign table on.
  # In this right-handed frame (+X fwd, +Y up) +Z is STARBOARD, so z<0 = port, z>0 = starboard;
  # x=-0.023 is the front pair, x=-0.397 the back pair. The `action_order` below — NOT the id
  # numbering — is the interface contract shared with the robot. If the id->position wiring is
  # ever found to differ on the real vehicle, fix it HERE by editing the names.
  units:
    - {id: 1, name: lf, pivot: [-0.022777, 0.09815, -0.187224], thrust_axis: [ 0.7081, 0.0,  0.7061]}
    - {id: 2, name: lb, pivot: [-0.397223, 0.09815, -0.187224], thrust_axis: [ 0.7081, 0.0, -0.7061]}
    - {id: 3, name: rf, pivot: [-0.022777, 0.09815,  0.187224], thrust_axis: [-0.7081, 0.0,  0.7061]}
    - {id: 4, name: rb, pivot: [-0.397223, 0.09815,  0.187224], thrust_axis: [-0.7081, 0.0, -0.7061]}
  # action[k] (both servo_k and esc_k) drives the unit NAMED action_order[k]. This MUST stay equal
  # to sinsei_UMIUSI_autonomy's POSITIONS, or a policy channel means a different thruster on the
  # robot than in sim — and nothing on either side can detect that. Note it is NOT id order:
  # here action[2] -> id 4 and action[3] -> id 3.
  action_order: [lf, lb, rb, rf]

# --- competition field (balloon-popping scenario) ---------------------------------------------
# Per-episode balloon field for the competition_balloon scenario
# (src/umiusi_sim/description/scenarios/competition_balloon.py -> sample_layout). Edit these to
# retune the field WITHOUT touching code. Heights and points per colour are fixed by rule and live
# in BALLOON_SPECS (red @0.5 m +30, blue @0.7 m -10 decoy, yellow @1.5 m +10).
competition:
  balloons:
    # PLACEHOLDER per-colour counts (TOTAL field size per colour). The exact rulebook
    # red/yellow/blue RATIO is TBD / user-tunable: competition videos suggest ~6-8 reds with
    # yellows and blues a comparable spread. The deterministic tall yellow "start" balloon (fixed
    # near target, always balloon 0) COUNTS AS ONE of the yellows.
    counts:
      red: 7        # PLACEHOLDER — ~6-8 reds seen in videos; rulebook ratio TBD
      yellow: 7     # PLACEHOLDER — includes the fixed start yellow
      blue: 5       # PLACEHOLDER — decoy (negative points)
    # Minimum centre-to-centre XY separation between balloons [m], enforced by the Poisson-disk /
    # rejection sampler so the field stays evenly spread (not clustered). Tunable.
    min_separation: 0.6
