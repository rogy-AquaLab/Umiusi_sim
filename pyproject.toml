# umiusi_sim — MuJoCo simulation + RL + perception for the UMIUSI azimuth-thruster underwater robot.
#
# ONE git repo (this remote), a uv WORKSPACE with TWO independently-installable wheels under packages/,
# so the code that lands on each deployment target is exactly what that target runs — nothing more:
#
#   packages/perception  -> distribution "umiusi_perception"  = the ON-ROBOT wheel.
#       learned detector + tracker + underwater restoration + balloon-popping autonomy FSM +
#       feed-forward thruster allocation (umiusi_perception.control, pure numpy). Deps: numpy + torch +
#       scipy + opencv. NO mujoco, NO gymnasium/sb3, and NO simulator/training SOURCE. This is the
#       whole point of the split: `pip install ./packages/perception` puts execution-only code on the Pi.
#
#   packages/sim         -> distribution "umiusi_sim"          = the DEV / TRAIN wheel (never on the robot).
#       umiusi_sim (simulator + hydrodynamics + MJCF, extra [sim]=mujoco) and umiusi_rl (Gymnasium env +
#       PPO/SAC/TD3 training, extra [rl] implies [sim]). Emits models (.zip/.pt/.onnx) that perception loads.
#
# The two wheels are INDEPENDENT (neither package imports the other); the cross-cutting glue lives in
# tools/ at the repo root and runs in the full workspace env. See ai/architecture.md §2 + docs/architecture.md.
#
# Install matrix (see README "Setup"):
#   uv sync                         # FULL local dev: both members editable + mujoco + rl + tooling  ← daily driver
#   uv sync --extra learn           #   + detector-training toolchain (ultralytics/onnx)
#   uv sync --extra viz             #   + decoupled ROS viewer (roslibpy)
#   pip install ./packages/perception   # DEPLOY on the robot/Pi: detector + FSM + control, sim/rl-FREE
#   pip install './packages/sim[rl]'     # training box: simulator + RL (no perception needed)
# This root is a uv "virtual" project (package=false): it is NOT built or published — it only aggregates
# the workspace for `uv sync`. The distributable wheels are the two members. CPU-only torch is pinned below.

[project]
name = "umiusi-workspace"
version = "0"
description = "Dev aggregator for the umiusi_sim workspace (not published; the wheels are packages/*)"
requires-python = ">=3.10"
# Bare `uv sync` = the complete dev/sim environment: both members (editable) with mujoco + RL, plus the
# video/mesh/lint tooling used by tools/. learn/viz are heavier/niche -> opt-in extras below.
dependencies = [
    "umiusi_sim[sim,rl]",
    "umiusi_perception",
    "imageio[ffmpeg]>=2.31",
    "fast-simplification",
    "ruff>=0.5",
]

[project.optional-dependencies]
# Learned balloon detector training (phase 5c "path B"): tiny-CNN / YOLOv8n / Hough+verifier candidates,
# benchmarked and exported to ONNX (int8) for the Raspberry Pi 4. Dev/train machine only.
learn = [
    "ultralytics>=8.2",
    "torchvision>=0.17",
    "onnx>=1.15",
    "onnxscript>=0.1",
    "onnxruntime>=1.17",
    "thop>=0.1.1",
    "albumentations>=1.4",
]
# Decoupled ROS viewer (tools/ros_view.py): attaches to a running ROS-driven sim over rosbridge
# (ws://localhost:9090) and renders it live. roslibpy is pure-Python (no ROS install needed).
viz = ["roslibpy>=1.5"]

# --- uv workspace --------------------------------------------------------------
[tool.uv]
# Virtual root: aggregate the workspace for `uv sync`, but do not build/install this root itself.
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
umiusi_sim = { workspace = true }
umiusi_perception = { workspace = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# CPU-only torch: this host has no CUDA GPU (MuJoCo sim is CPU-bound, the policy MLP is tiny). Pin torch
# to the PyTorch CPU wheel so `uv sync` pulls the small CPU build. (On the aarch64 Pi, `pip install
# ./packages/perception` uses the default index / piwheels instead — this pin is a dev-host convenience.)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 119
