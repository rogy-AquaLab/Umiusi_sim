# umiusi_sim — MuJoCo simulation + RL for the UMIUSI azimuth-thruster underwater robot.
#
# Two installable packages under src/ (clean responsibility split):
#   umiusi_sim  — reusable simulator + analytical hydrodynamics + robot description (MJCF)
#   umiusi_rl   — Gymnasium env + PPO/SAC/TD3 training + evaluation (depends on umiusi_sim)
#
# Setup (recommended, no manual venv):  uv sync          then  uv run python -m tools.validate_sim
# CPU-only torch is pinned via the PyTorch CPU index below (this host has no CUDA GPU).

[project]
name = "umiusi_sim"
version = "0.1.0"
description = "MuJoCo simulation + RL for the UMIUSI azimuth-thruster underwater robot"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.2",
]

[project.optional-dependencies]
# Tooling for videos/snapshots (imageio), training curves (tensorboard), mesh decimation, lint.
dev = ["imageio[ffmpeg]>=2.31", "tensorboard>=2.15", "fast-simplification", "ruff>=0.5"]
# Perception (phase 5b): classical-CV balloon detector. scipy.ndimage.label gives lightweight
# connected-component labelling (preferred over pulling in opencv); RGB->HSV is done in numpy.
perception = ["scipy>=1.10", "opencv-python-headless>=4.8"]
# Decoupled ROS viewer (tools/ros_view.py): attaches to a running ROS-driven sim over rosbridge
# (ws://localhost:9090) and renders it live. roslibpy is pure-Python (no ROS install needed), so
# it installs into this uv venv; the sim publishes /umiusi_sim/qpos which the viewer replays.
viz = ["roslibpy>=1.5"]
# Learned balloon detector (phase 5c "path B"): tiny-CNN / YOLOv8n / Hough+verifier candidates,
# benchmarked and exported to ONNX (int8) for the Raspberry Pi 4 target.
#   ultralytics  — YOLOv8n reference architecture (candidate b) + its ONNX export
#   torchvision  — pulled by ultralytics; pinned to the CPU wheel like torch (see sources below)
#   onnx/onnxruntime — the realistic edge runtime we time under (int8 quantized, single-thread)
#   thop         — FLOP counting for the projection to Pi 4
#   albumentations — heavy augmentation (colour jitter, blur, underwater colour-cast) to stretch 40 imgs
learn = [
    "ultralytics>=8.2",
    "torchvision>=0.17",
    "onnx>=1.15",
    "onnxscript>=0.1",
    "onnxruntime>=1.17",
    "thop>=0.1.1",
    "albumentations>=1.4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# --- Package discovery (src-layout: two top-level packages) -------------------
[tool.setuptools.packages.find]
where = ["src"]

# Ship the MJCF robot description with the umiusi_sim package (for non-editable installs).
[tool.setuptools.package-data]
"umiusi_sim" = ["description/*.xml"]

# --- uv: CPU-only torch --------------------------------------------------------
# This host has no CUDA GPU (MuJoCo sim is CPU-bound, the policy MLP is tiny). Pin torch to
# the PyTorch CPU wheel so `uv sync` pulls the small CPU build instead of the CUDA build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 119
